<?xml version="1.0" encoding="UTF-8"?>
<!-- 技术占位：Wall 单图块（64×64）。
     仅用于让 WallLayer 在 GUI 中可绘制、可区分；逻辑职责只由所在图层决定，不由本图颜色/形状/文件名决定。
     对应原共享 atlas 右上象限：普通静态阻挡块。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect x="0" y="0" width="64" height="64" fill="#6e3b3b"/>
  <rect x="6" y="6" width="52" height="52" fill="none" stroke="#2a1414" stroke-width="6"/>
</svg>
