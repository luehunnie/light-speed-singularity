<?xml version="1.0" encoding="UTF-8"?>
<!-- 技术占位：LegalArea 单图块（64×64）。
     仅用于让 LegalAreaLayer 在 GUI 中可绘制、可区分；逻辑职责只由所在图层决定，不由本图颜色/形状/文件名决定。
     对应原共享 atlas 左下象限：Terrain 内允许放置覆盖。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect x="0" y="0" width="64" height="64" fill="#2f6f8f"/>
  <circle cx="18" cy="18" r="5" fill="#8fd0f0"/>
  <circle cx="46" cy="18" r="5" fill="#8fd0f0"/>
  <circle cx="18" cy="46" r="5" fill="#8fd0f0"/>
  <circle cx="46" cy="46" r="5" fill="#8fd0f0"/>
</svg>
